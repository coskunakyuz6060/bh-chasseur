name: Chasse aux voitures

on:
  schedule:
    # 3 passages par jour (heure de Paris ≈ 7h, 13h, 18h en hiver ; 8h, 14h, 19h en été)
    - cron: "5 6,12,17 * * *"
  workflow_dispatch: {}   # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: chasse
  cancel-in-progress: false

jobs:
  chasse:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer le robot
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Lancer la recherche
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scraper/run.mjs
      - name: Enregistrer les résultats
        if: always()
        run: |
          git config user.name "BH Chasseur"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Résultats du $(date +'%d/%m/%Y %H:%M')"
          # récupère d'abord les changements faits depuis l'appli (réglages) pour éviter un conflit
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            sleep 5
          done
