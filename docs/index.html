<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BH Chasseur</title>
<meta name="theme-color" content="#13294B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bleu:#13294B;--orange:#FF6A13;--gris:#75787B;--fond:#f3f5f8;--carte:#fff;--txt:#14181f;--txt2:#5b6370;--bord:#e2e6ec;--vert:#1d8a4b;--rouge:#c23b22}
@media (prefers-color-scheme:dark){:root{--fond:#0d1522;--carte:#16202f;--txt:#eef1f5;--txt2:#9aa4b2;--bord:#263246;--vert:#3fbf74;--rouge:#ef6a50}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--txt);-webkit-tap-highlight-color:transparent}
header{background:var(--bleu);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:9px;background:#fff;color:var(--bleu);display:grid;place-items:center;font-weight:800;position:relative;overflow:hidden;font-size:15px}
.logo::after{content:"";position:absolute;left:6px;right:6px;bottom:5px;height:3px;background:var(--orange);border-radius:2px}
h1{font-size:17px;margin:0;letter-spacing:.5px}h1 small{display:block;font-weight:400;font-size:11px;opacity:.75;letter-spacing:0}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{flex:1;border:0;border-radius:8px;padding:8px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:13px}
.tabs button.on{background:var(--orange)}
main{padding:12px 16px 90px;max-width:760px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--carte);border:1px solid var(--bord);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--txt2)}
.filtres{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--bord);background:var(--carte);color:var(--txt);border-radius:999px;padding:7px 12px;font-size:13px}
.chip.on{background:var(--bleu);color:#fff;border-color:var(--bleu)}
select.chip{appearance:none}
.maj{font-size:12px;color:var(--txt2);margin:0 0 10px}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:12px;margin-bottom:12px;overflow:hidden}
.carte.ba{border-left:4px solid var(--orange)}
.haut{display:flex;gap:10px;padding:10px}
.photo{width:96px;height:72px;border-radius:8px;object-fit:cover;background:var(--bord);flex:none}
.titre{font-weight:700;font-size:15px;line-height:1.25;margin:0 0 4px}
.sous{font-size:13px;color:var(--txt2)}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.b{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--bord);color:var(--txt)}
.b.j{background:#13294B;color:#fff}.b.o{background:var(--orange);color:#fff}.b.r{background:var(--rouge);color:#fff}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--bord)}
.chiffres div{padding:8px 10px;border-right:1px solid var(--bord)}.chiffres div:last-child{border:0}
.chiffres span{display:block;font-size:11px;color:var(--txt2)}.chiffres b{font-size:15px}
.pos{color:var(--vert)}.neg{color:var(--rouge)}
.lbc{display:flex;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--bord);font-size:13px}
.lbc input{width:100px;padding:7px 8px;border:1px solid var(--bord);border-radius:7px;background:var(--fond);color:var(--txt);font-size:14px}
.actions{display:flex;border-top:1px solid var(--bord)}
.actions a,.actions button{flex:1;text-align:center;padding:11px 6px;font-size:13px;font-weight:600;text-decoration:none;color:var(--bleu);background:none;border:0;border-right:1px solid var(--bord)}
@media (prefers-color-scheme:dark){.actions a,.actions button{color:#9cc0ff}}
.actions a:last-child{border:0}.actions a.lb{color:var(--orange)}
.vide{text-align:center;color:var(--txt2);padding:40px 10px}
.aide{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:14px 16px;margin-bottom:12px;font-size:14px;line-height:1.5}
.aide h2{font-size:15px;margin:0 0 6px;color:var(--orange)}
.aide a{color:var(--orange)}
.btn{display:block;text-align:center;background:var(--orange);color:#fff!important;text-decoration:none;border-radius:10px;padding:12px;font-weight:700;margin:8px 0}
.btn.s{background:var(--bleu)}
.detail{font-size:12px;color:var(--txt2);padding:0 10px 8px}
</style>
</head>
<body>
<header>
  <div class="top"><div class="logo">BH</div><h1>BH CHASSEUR<small>Enchères judiciaires & VO · BH AUTOSELECT</small></h1></div>
  <div class="tabs"><button data-t="lots" class="on">Annonces</button><button data-t="favs">★ Suivies</button><button data-t="aide">Réglages</button></div>
</header>
<main id="app"><p class="vide">Chargement…</p></main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lien = (u) => /^https:\/\//.test(u || '') ? esc(u) : '#';
const eur = (n) => n == null ? '—' : Math.round(n).toLocaleString('fr-FR') + ' €';
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let data = { lots: [] }, onglet = 'lots';
let f = store.get('filtres', { ba: true, jud: false, zone: true, src: 'toutes', tri: 'marge', prixMax: 5000 });
let lbc = store.get('lbc', {}), favs = store.get('favs', {});
const repo = (() => { const m = location.hostname.match(/^([^.]+)\.github\.io$/); const r = location.pathname.split('/').filter(Boolean)[0]; return m && r ? `https://github.com/${m[1]}/${r}` : null; })();

function margeDe(l) { const p = lbc[l.id]; if (p && l.coutTotal) return Math.round(p * 0.92) - l.coutTotal; return l.marge; }
function quand(d) {
  if (!d) return '';
  const dt = new Date(d), j = Math.round((new Date(d.slice(0, 10)) - new Date(new Date().toISOString().slice(0, 10))) / 864e5);
  const h = d.includes('T') ? ' ' + d.slice(11, 16).replace(':', 'h') : '';
  return (j === 0 ? "aujourd'hui" : j === 1 ? 'demain' : j > 1 ? `dans ${j} j (${dt.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' })})` : 'passée') + h;
}
function carte(l0) {
  const l = { ...l0, titre: esc(l0.titre), marque: esc(l0.marque), modele: esc(l0.modele), ville: esc(l0.ville), risque: esc(l0.risque), source: esc(l0.source), carburant: esc(l0.carburant), cp: esc(l0.cp), id: esc(l0.id), url: lien(l0.url), leboncoin: lien(l0.leboncoin), photo: l0.photo ? lien(l0.photo) : null };
  const m = margeDe(l0), perso = !!lbc[l0.id];
  return `<article class="carte ${l.bonneAffaire ? 'ba' : ''}">
  <div class="haut">${l.photo ? `<img class="photo" loading="lazy" src="${l.photo}" alt="" onerror="this.style.visibility='hidden'">` : '<div class="photo"></div>'}
   <div style="min-width:0"><p class="titre">${[l.marque, l.modele ? l.modele.toUpperCase() : ''].join(' ')} ${l.annee || ''}</p>
   <div class="sous">${l.km ? l.km.toLocaleString('fr-FR') + ' km' : 'km ?'} · ${l.carburant || 'carburant ?'}${l.boiteAuto ? ' · auto' : ''}</div>
   <div class="sous">${l.ville || ''} ${l.cp ? '(' + l.cp.slice(0, 2) + ')' : ''} · vente ${quand(l.dateVente) || 'date ?'}</div>
   <div class="badges">${l.judiciaire ? '<span class="b j">⚖ Judiciaire</span>' : ''}${l.bonneAffaire ? '<span class="b o">Bonne affaire</span>' : ''}<span class="b">${l.source}</span>${l.risque ? `<span class="b r">⚠ ${l.risque}</span>` : ''}${!l.dansZone ? '<span class="b">hors zone</span>' : ''}</div></div></div>
  <div class="detail">${l.titre}</div>
  <div class="chiffres"><div><span>Achat estimé</span><b>${eur(l.coutTotal)}</b></div><div><span>${perso ? 'Revente (LBC)' : 'Cote estimée'}</span><b>${eur(perso ? lbc[l0.id] : l.cote)}</b></div><div><span>Marge</span><b class="${m > 0 ? 'pos' : 'neg'}">${eur(m)}</b></div></div>
  <div class="detail">Achat : ${eur(l.prixProbable)} (${l.base}) + frais ${l.fraisPct ?? '?'} % + frais fixes</div>
  <div class="lbc">Prix moyen vu sur Leboncoin : <input inputmode="numeric" placeholder="ex. 6500" data-lbc="${l.id}" value="${lbc[l0.id] || ''}"> €</div>
  <div class="actions"><a href="${l.url}" target="_blank" rel="noopener">Voir le lot</a><a class="lb" href="${l.leboncoin}" target="_blank" rel="noopener">Comparer Leboncoin</a><button data-fav="${l.id}">${favs[l0.id] ? '★ Suivi' : '☆ Suivre'}</button></div>
 </article>`;
}
function filtrer() {
  let L = data.lots.filter((l) => (!f.ba || l.bonneAffaire || (lbc[l.id] && margeDe(l) >= (data.reglages?.margeMinBonneAffaire || 700))) && (!f.jud || l.judiciaire) && (!f.zone || l.dansZone) && (f.src === 'toutes' || l.source === f.src) && (!l.prixProbable || l.prixProbable <= f.prixMax));
  const t = { marge: (a, b) => (margeDe(b) ?? -1e9) - (margeDe(a) ?? -1e9), date: (a, b) => (a.dateVente || '9') < (b.dateVente || '9') ? -1 : 1, prix: (a, b) => (a.coutTotal ?? 1e9) - (b.coutTotal ?? 1e9), nouveau: (a, b) => (b.premiereVue || '') > (a.premiereVue || '') ? 1 : -1 };
  return L.sort(t[f.tri]);
}
function rendre() {
  const app = $('#app');
  if (onglet === 'aide') return rendreAide();
  const sources = [...new Set(data.lots.map((l) => l.source))];
  const L = onglet === 'favs' ? data.lots.filter((l) => favs[l.id]) : filtrer();
  const nb = data.lots.filter((l) => l.bonneAffaire).length, nj = data.lots.filter((l) => l.judiciaire).length;
  app.innerHTML = `
  <div class="stats"><div class="stat"><b>${data.lots.length}</b><span>voitures suivies</span></div><div class="stat"><b style="color:var(--orange)">${nb}</b><span>bonnes affaires</span></div><div class="stat"><b>${nj}</b><span>judiciaires</span></div></div>
  ${onglet === 'lots' ? `<div class="filtres">
   <button class="chip ${f.ba ? 'on' : ''}" data-f="ba">Bonnes affaires</button>
   <button class="chip ${f.jud ? 'on' : ''}" data-f="jud">⚖ Judiciaire</button>
   <button class="chip ${f.zone ? 'on' : ''}" data-f="zone">Ma zone</button>
   <select class="chip" data-s="src"><option value="toutes">Toutes sources</option>${sources.map((s) => `<option ${f.src === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
   <select class="chip" data-s="tri">${[['marge', 'Tri : marge'], ['date', 'Tri : date de vente'], ['prix', 'Tri : prix'], ['nouveau', 'Tri : nouveautés']].map(([v, t]) => `<option value="${v}" ${f.tri === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
   <select class="chip" data-s="prixMax">${[1500, 2500, 3500, 5000, 8000].map((v) => `<option value="${v}" ${+f.prixMax === v ? 'selected' : ''}>≤ ${v.toLocaleString('fr-FR')} €</option>`).join('')}</select>
  </div>` : ''}
  <p class="maj">${data.miseAJour ? 'Mis à jour ' + new Date(data.miseAJour).toLocaleString('fr-FR', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'Le robot n\'a pas encore tourné.'} · ${L.length} affichée(s)</p>
  ${L.map(carte).join('') || `<p class="vide">${onglet === 'favs' ? 'Touche « ☆ Suivre » sur une annonce pour la retrouver ici.' : 'Aucune annonce avec ces filtres.<br>Essaie d\'enlever « Bonnes affaires » ou « Ma zone ».'}</p>`}`;
}
function rendreAide() {
  const r = data.reglages || {};
  $('#app').innerHTML = `
  <div class="aide"><h2>Lancer une recherche maintenant</h2>Le robot passe 3 fois par jour tout seul. Pour forcer un passage :
   ${repo ? `<a class="btn" href="${repo}/actions/workflows/chasse.yml" target="_blank">Ouvrir le robot sur GitHub</a>puis « Run workflow ». Compte 10 à 20 min.` : '<br><i>(lien disponible une fois l\'appli en ligne sur GitHub)</i>'}</div>
  <div class="aide"><h2>Réglages actuels</h2>
   Prix d'achat max : <b>${eur(r.prixMaxAchat)}</b><br>Marge mini « bonne affaire » : <b>${eur(r.margeMinBonneAffaire)}</b><br>Frais fixes par voiture (transport, remise en état) : <b>${eur(r.fraisFixesParVoiture)}</b><br>Départements de retrait : <b>${(r.departementsRetrait || []).join(', ')}</b>
   ${repo ? `<a class="btn s" href="${repo}/edit/main/config.json" target="_blank">Modifier les réglages</a>` : ''}</div>
  <div class="aide"><h2>Comment lire une annonce</h2>
   <b>Achat estimé</b> = prix d'adjudication probable + frais acheteur + frais fixes.<br>
   <b>Cote estimée</b> = prix de revente visé, calculé selon le modèle, l'année et les km. C'est une estimation : vérifie toujours avec <b>Comparer Leboncoin</b>.<br>
   Tape le prix moyen que tu vois sur Leboncoin dans la case : la marge est recalculée (avec −8 % de négociation).<br>
   <b>⚖ Judiciaire</b> = liquidation, saisie, vente sur décision de justice ou vente de l'État.</div>
  <div class="aide"><h2>Avant d'enchérir</h2>Vérifie le PV / la fiche d'état, la présence du certificat d'immatriculation et des clés, le CT, et lis les conditions de vente (frais, délai de retrait, paiement). Ajoute le transport si la voiture ne roule pas.</div>`;
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-t]'); if (t) { onglet = t.dataset.t; document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b === t)); rendre(); window.scrollTo(0, 0); return; }
  const c = e.target.closest('[data-f]'); if (c) { f[c.dataset.f] = !f[c.dataset.f]; store.set('filtres', f); rendre(); return; }
  const fv = e.target.closest('[data-fav]'); if (fv) { const id = fv.dataset.fav; favs[id] ? delete favs[id] : (favs[id] = 1); store.set('favs', favs); rendre(); }
});
document.addEventListener('change', (e) => {
  const s = e.target.closest('[data-s]'); if (s) { f[s.dataset.s] = s.dataset.s === 'prixMax' ? +s.value : s.value; store.set('filtres', f); rendre(); return; }
  const i = e.target.closest('[data-lbc]'); if (i) { const v = parseInt(i.value.replace(/\D/g, ''), 10); v ? (lbc[i.dataset.lbc] = v) : delete lbc[i.dataset.lbc]; store.set('lbc', lbc); rendre(); }
});
fetch('data/lots.json?t=' + Date.now()).then((r) => r.json()).then((d) => { data = d; f.prixMax = f.prixMax || d.reglages?.prixMaxAchat || 5000; rendre(); }).catch(() => { $('#app').innerHTML = '<p class="vide">Pas encore de résultats.<br>Lance le robot depuis l\'onglet Réglages.</p>'; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
