<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BH Chasseur</title>
<meta name="theme-color" content="#13294B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bleu:#13294B;--orange:#FF6A13;--gris:#75787B;--fond:#f3f5f8;--carte:#fff;--txt:#14181f;--txt2:#5b6370;--bord:#e2e6ec;--vert:#1d8a4b;--rouge:#c23b22}
@media (prefers-color-scheme:dark){:root{--fond:#0d1522;--carte:#16202f;--txt:#eef1f5;--txt2:#9aa4b2;--bord:#263246;--vert:#3fbf74;--rouge:#ef6a50}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--txt);-webkit-tap-highlight-color:transparent}
header{background:var(--bleu);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:9px;background:#fff;color:var(--bleu);display:grid;place-items:center;font-weight:800;position:relative;overflow:hidden;font-size:15px}
.logo::after{content:"";position:absolute;left:6px;right:6px;bottom:5px;height:3px;background:var(--orange);border-radius:2px}
h1{font-size:17px;margin:0;letter-spacing:.5px}h1 small{display:block;font-weight:400;font-size:11px;opacity:.75;letter-spacing:0}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{flex:1;border:0;border-radius:8px;padding:8px 4px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:13px}
.tabs button.on{background:var(--orange)}
main{padding:12px 16px 90px;max-width:760px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--carte);border:1px solid var(--bord);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--txt2)}
.filtres{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--bord);background:var(--carte);color:var(--txt);border-radius:999px;padding:7px 12px;font-size:13px}
.chip.on{background:var(--bleu);color:#fff;border-color:var(--bleu)}
select.chip{appearance:none}
.maj{font-size:12px;color:var(--txt2);margin:0 0 10px}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:12px;margin-bottom:12px;overflow:hidden}
.carte.ba{border-left:4px solid var(--orange)}
.haut{display:flex;gap:10px;padding:10px}
.photo{width:96px;height:72px;border-radius:8px;object-fit:cover;background:var(--bord);flex:none}
.titre{font-weight:700;font-size:15px;line-height:1.25;margin:0 0 4px}
.sous{font-size:13px;color:var(--txt2)}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.b{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--bord);color:var(--txt)}
.b.j{background:#13294B;color:#fff}.b.o{background:var(--orange);color:#fff}.b.r{background:var(--rouge);color:#fff}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--bord)}
.chiffres div{padding:8px 10px;border-right:1px solid var(--bord)}.chiffres div:last-child{border:0}
.chiffres span{display:block;font-size:11px;color:var(--txt2)}.chiffres b{font-size:15px}
.pos{color:var(--vert)}.neg{color:var(--rouge)}
.lbc{display:flex;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--bord);font-size:13px}
.lbc input{width:100px;padding:7px 8px;border:1px solid var(--bord);border-radius:7px;background:var(--fond);color:var(--txt);font-size:14px}
.actions{display:flex;border-top:1px solid var(--bord)}
.actions a,.actions button{flex:1;text-align:center;padding:11px 6px;font-size:13px;font-weight:600;text-decoration:none;color:var(--bleu);background:none;border:0;border-right:1px solid var(--bord)}
@media (prefers-color-scheme:dark){.actions a,.actions button{color:#9cc0ff}}
.actions a:last-child{border:0}.actions a.lb{color:var(--orange)}
.vide{text-align:center;color:var(--txt2);padding:40px 10px}
.aide{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:14px 16px;margin-bottom:12px;font-size:14px;line-height:1.5}
.aide h2{font-size:15px;margin:0 0 6px;color:var(--orange)}
.aide a{color:var(--orange)}
.btn{display:block;text-align:center;background:var(--orange);color:#fff!important;text-decoration:none;border-radius:10px;padding:12px;font-weight:700;margin:8px 0}
.btn.s{background:var(--bleu)}
.detail{font-size:12px;color:var(--txt2);padding:0 10px 8px}
.cible{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.cible .l1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cible b{font-size:15px}.cible .sous{margin-top:2px}
.cible .px{font-size:13px;margin:6px 0}
.cible .px strong{color:var(--orange);font-size:16px}
.cible .bt{display:flex;gap:8px}.cible .bt a{flex:1;text-align:center;background:var(--orange);color:#fff;text-decoration:none;border-radius:8px;padding:9px;font-weight:700;font-size:13px}
.cible .bt button{border:1px solid var(--bord);background:none;color:var(--txt2);border-radius:8px;padding:9px 12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form input,.form select{width:100%;padding:9px;border:1px solid var(--bord);border-radius:8px;background:var(--fond);color:var(--txt);font-size:14px}
.form .full{grid-column:1/-1}
.form button{grid-column:1/-1;background:var(--bleu);color:#fff;border:0;border-radius:8px;padding:11px;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="top"><div class="logo">BH</div><h1>BH CHASSEUR<small>Enchères judiciaires & VO · BH AUTOSELECT</small></h1></div>
  <div class="tabs"><button data-t="lots" class="on">Annonces</button><button data-t="lbc">Leboncoin</button><button data-t="favs">★ Suivies</button><button data-t="aide">Réglages</button></div>
</header>
<main id="app"><p class="vide">Chargement…</p></main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lien = (u) => /^https:\/\//.test(u || '') ? esc(u) : '#';
const eur = (n) => n == null ? '—' : Math.round(n).toLocaleString('fr-FR') + ' €';
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let data = { lots: [] }, onglet = 'lots';
let f = store.get('filtres', { ba: true, jud: false, zone: true, src: 'toutes', tri: 'marge', prixMax: 5000 });
let lbc = store.get('lbc', {}), favs = store.get('favs', {});
const repo = (() => { const m = location.hostname.match(/^([^.]+)\.github\.io$/); const r = location.pathname.split('/').filter(Boolean)[0]; return m && r ? `https://github.com/${m[1]}/${r}` : null; })();

function margeDe(l) { const p = lbc[l.id]; if (p && l.coutTotal) return Math.round(p * 0.92) - l.coutTotal; return l.marge; }
function quand(d) {
  if (!d) return '';
  const dt = new Date(d), j = Math.round((new Date(d.slice(0, 10)) - new Date(new Date().toISOString().slice(0, 10))) / 864e5);
  const h = d.includes('T') ? ' ' + d.slice(11, 16).replace(':', 'h') : '';
  return (j === 0 ? "aujourd'hui" : j === 1 ? 'demain' : j > 1 ? `dans ${j} j (${dt.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' })})` : 'passée') + h;
}
function carte(l0) {
  const l = { ...l0, titre: esc(l0.titre), marque: esc(l0.marque), modele: esc(l0.modele), ville: esc(l0.ville), risque: esc(l0.risque), source: esc(l0.source), carburant: esc(l0.carburant), cp: esc(l0.cp), id: esc(l0.id), url: lien(l0.url), leboncoin: lien(l0.leboncoin), photo: l0.photo ? lien(l0.photo) : null };
  const m = margeDe(l0), perso = !!lbc[l0.id];
  return `<article class="carte ${l.bonneAffaire ? 'ba' : ''}">
  <div class="haut">${l.photo ? `<img class="photo" loading="lazy" src="${l.photo}" alt="" onerror="this.style.visibility='hidden'">` : '<div class="photo"></div>'}
   <div style="min-width:0"><p class="titre">${[l.marque, l.modele ? l.modele.toUpperCase() : ''].join(' ')} ${l.annee || ''}</p>
   <div class="sous">${l.km ? l.km.toLocaleString('fr-FR') + ' km' : 'km ?'} · ${l.carburant || 'carburant ?'}${l.boiteAuto ? ' · auto' : ''}</div>
   <div class="sous">${l.ville || ''} ${l.cp ? '(' + l.cp.slice(0, 2) + ')' : ''} · vente ${quand(l.dateVente) || 'date ?'}</div>
   <div class="badges">${l.judiciaire ? '<span class="b j">⚖ Judiciaire</span>' : ''}${l.bonneAffaire ? '<span class="b o">Bonne affaire</span>' : ''}<span class="b">${l.source}</span>${l.risque ? `<span class="b r">⚠ ${l.risque}</span>` : ''}${!l.dansZone ? '<span class="b">hors zone</span>' : ''}</div></div></div>
  <div class="detail">${l.titre}</div>
  <div class="chiffres"><div><span>Achat estimé</span><b>${eur(l.coutTotal)}</b></div><div><span>${perso ? 'Revente (LBC)' : 'Cote estimée'}</span><b>${eur(perso ? lbc[l0.id] : l.cote)}</b></div><div><span>Marge</span><b class="${m > 0 ? 'pos' : 'neg'}">${eur(m)}</b></div></div>
  <div class="detail">Achat : ${eur(l.prixProbable)} (${l.base}) + frais ${l.fraisPct ?? '?'} % + frais fixes</div>
  <div class="lbc">Prix moyen vu sur Leboncoin : <input inputmode="numeric" placeholder="ex. 6500" data-lbc="${l.id}" value="${lbc[l0.id] || ''}"> €</div>
  <div class="actions"><a href="${l.url}" target="_blank" rel="noopener">Voir le lot</a><a class="lb" href="${l.leboncoin}" target="_blank" rel="noopener">Comparer Leboncoin</a><button data-fav="${l.id}">${favs[l0.id] ? '★ Suivi' : '☆ Suivre'}</button></div>
 </article>`;
}
function filtrer() {
  let L = data.lots.filter((l) => (!f.ba || l.bonneAffaire || (lbc[l.id] && margeDe(l) >= R().margeMinBonneAffaire)) && (!f.jud || l.judiciaire) && (!f.zone || l.dansZone) && (f.src === 'toutes' || l.source === f.src) && (!l.prixProbable || l.prixProbable <= f.prixMax));
  const t = { marge: (a, b) => (margeDe(b) ?? -1e9) - (margeDe(a) ?? -1e9), date: (a, b) => (a.dateVente || '9') < (b.dateVente || '9') ? -1 : 1, prix: (a, b) => (a.coutTotal ?? 1e9) - (b.coutTotal ?? 1e9), nouveau: (a, b) => (b.premiereVue || '') > (a.premiereVue || '') ? 1 : -1 };
  return L.sort(t[f.tri]);
}
function rendre() {
  const app = $('#app');
  if (onglet === 'aide') return rendreAide();
  if (onglet === 'lbc') return rendreLbc();
  const sources = [...new Set(data.lots.map((l) => l.source))];
  const L = onglet === 'favs' ? data.lots.filter((l) => favs[l.id]) : filtrer();
  const nb = data.lots.filter((l) => l.bonneAffaire).length, nj = data.lots.filter((l) => l.judiciaire).length;
  app.innerHTML = `
  <div class="stats"><div class="stat"><b>${data.lots.length}</b><span>voitures suivies</span></div><div class="stat"><b style="color:var(--orange)">${nb}</b><span>bonnes affaires</span></div><div class="stat"><b>${nj}</b><span>judiciaires</span></div></div>
  ${onglet === 'lots' ? `<div class="filtres">
   <button class="chip ${f.ba ? 'on' : ''}" data-f="ba">Bonnes affaires</button>
   <button class="chip ${f.jud ? 'on' : ''}" data-f="jud">⚖ Judiciaire</button>
   <button class="chip ${f.zone ? 'on' : ''}" data-f="zone">Ma zone</button>
   <select class="chip" data-s="src"><option value="toutes">Toutes sources</option>${sources.map((s) => `<option ${f.src === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
   <select class="chip" data-s="tri">${[['marge', 'Tri : marge'], ['date', 'Tri : date de vente'], ['prix', 'Tri : prix'], ['nouveau', 'Tri : nouveautés']].map(([v, t]) => `<option value="${v}" ${f.tri === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
   <select class="chip" data-s="prixMax">${[...new Set([1500, 2500, 3500, 5000, 8000, +R().prixMaxAchat])].sort((a, b) => a - b).map((v) => `<option value="${v}" ${+f.prixMax === v ? 'selected' : ''}>≤ ${v.toLocaleString('fr-FR')} €</option>`).join('')}</select>
  </div>` : ''}
  <p class="maj">${data.miseAJour ? 'Mis à jour ' + new Date(data.miseAJour).toLocaleString('fr-FR', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'Le robot n\'a pas encore tourné.'} · ${L.length} affichée(s)</p>
  ${L.map(carte).join('') || `<p class="vide">${onglet === 'favs' ? 'Touche « ☆ Suivre » sur une annonce pour la retrouver ici.' : 'Aucune annonce avec ces filtres.<br>Essaie d\'enlever « Bonnes affaires » ou « Ma zone ».'}</p>`}`;
}
// ---------- Chasse Leboncoin : recherches pré-réglées sous le prix du marché ----------
const CIBLES_DEFAUT = [
  ['renault clio', 2012, 2016, 160000, 'diesel'], ['renault clio', 2010, 2015, 150000, 'essence'],
  ['peugeot 207', 2008, 2012, 160000, 'essence'], ['peugeot 208', 2013, 2017, 150000, 'essence'],
  ['citroen c3', 2011, 2016, 150000, 'essence'], ['volkswagen polo', 2010, 2015, 160000, 'essence'],
  ['toyota yaris', 2008, 2014, 180000, 'essence'], ['renault twingo', 2009, 2014, 140000, 'essence'],
  ['dacia sandero', 2010, 2016, 160000, 'essence'], ['peugeot 308', 2010, 2015, 180000, 'diesel'],
  ['renault megane', 2010, 2015, 180000, 'diesel'], ['ford fiesta', 2010, 2015, 150000, 'essence'],
  ['opel corsa', 2010, 2015, 150000, 'essence'], ['citroen c1', 2008, 2014, 140000, 'essence'],
].map(([modele, aMin, aMax, kmMax, carb]) => ({ modele, aMin, aMax, kmMax, carb }));
let cibles = store.get('cibles', CIBLES_DEFAUT);
let remise = store.get('remise', 25);
const CP = { essence: '1', diesel: '2' };
function coteCible(c) {
  if (!window.coteEstimee || !window.detecterMarqueModele) return null;
  const { marque, modele } = window.detecterMarqueModele(c.modele);
  const annee = Math.round((c.aMin + c.aMax) / 2), age = Math.max(1, new Date().getFullYear() - annee);
  const km = Math.min(c.kmMax, age * 13000);
  return window.coteEstimee({ marque, modele, annee, km, carburant: c.carb });
}
function lienCible(c, pMax) {
  const p = new URLSearchParams({ category: '2', text: c.modele, regdate: `${c.aMin}-${c.aMax}`, mileage: `min-${c.kmMax}` });
  if (CP[c.carb]) p.set('fuel', CP[c.carb]);
  if (pMax) p.set('price', `${Math.round(pMax * 0.4 / 50) * 50}-${pMax}`);
  p.set('sort', 'time'); p.set('order', 'desc');
  return 'https://www.leboncoin.fr/recherche?' + p.toString();
}
function rendreLbc() {
  $('#app').innerHTML = `
  <div class="aide"><h2>Annonces Leboncoin sous le prix du marché</h2>
   Chaque bouton ouvre Leboncoin avec les bons filtres (modèle, années, km, carburant) et un <b>prix plafond = cote − ${remise} %</b>, classé du plus récent au plus ancien.<br>
   <b>Pour être prévenu en premier :</b> dans Leboncoin, ajoute ta zone (ex. Noyon + 100 km), puis touche <b>« Enregistrer la recherche »</b> et active les <b>notifications</b>. Leboncoin t'enverra une alerte dès qu'une annonce sort.<br>
   <span class="sous">Un prix très bas (moins de 40 % de la cote) est exclu : c'est souvent une arnaque ou une épave.</span>
   <div class="form" style="margin-top:10px"><label class="full">Remise mini sous la cote : <b>${remise} %</b><input type="range" min="10" max="45" step="5" value="${remise}" data-remise></label></div></div>
  ${cibles.map((c, i) => { const cote = coteCible(c); const pMax = cote ? Math.round(cote * (1 - remise / 100) / 50) * 50 : null; return `
   <div class="cible"><div class="l1"><b>${esc(c.modele.toUpperCase())}</b><span class="b">${esc(c.carb)}</span></div>
    <div class="sous">${c.aMin}–${c.aMax} · ≤ ${(+c.kmMax).toLocaleString('fr-FR')} km</div>
    <div class="px">Cote ~${eur(cote)} → cherche à <strong>≤ ${eur(pMax)}</strong></div>
    <div class="bt"><a href="${esc(lienCible(c, pMax))}" target="_blank" rel="noopener">Ouvrir sur Leboncoin</a><button data-delc="${i}">Retirer</button></div></div>`; }).join('')}
  <div class="aide"><h2>Ajouter une recherche</h2>
   <form class="form" id="ajout">
    <input class="full" name="modele" placeholder="Marque + modèle (ex. renault scenic)" required>
    <input name="aMin" inputmode="numeric" placeholder="Année min" required><input name="aMax" inputmode="numeric" placeholder="Année max" required>
    <input name="kmMax" inputmode="numeric" placeholder="Km max" required>
    <select name="carb"><option>essence</option><option>diesel</option><option>hybride</option></select>
    <button>Ajouter</button></form>
   <p class="sous" style="margin-top:8px"><a href="#" data-reset>Remettre la liste par défaut</a></p></div>`;
}
// ---------- Réglages modifiables dans l'appli ----------
const DEP_ZONES = {
  'Autour de Noyon (~150 km)': ['60', '80', '02', '95', '77', '93', '94', '92', '75', '78', '91', '51', '76', '27', '59', '62'],
  'Hauts-de-France + IDF': ['02', '59', '60', '62', '80', '75', '77', '78', '91', '92', '93', '94', '95'],
  'Toute la France': [...Array.from({ length: 95 }, (_, i) => String(i + 1).padStart(2, '0')).filter((d) => d !== '20'), '2A', '2B'],
};
const REG_DEFAUT = { prixMaxAchat: 5000, margeMinBonneAffaire: 700, fraisFixesParVoiture: 300, fraisAcheteurParDefautPourcent: 14.4, departementsRetrait: DEP_ZONES['Autour de Noyon (~150 km)'], maxAlertesParPassage: 8, sources: { interencheres: true, alcopa: true, domaines: true } };
let regLocal = store.get('reglages', null);
let gh = store.get('gh', { token: '' });
let ghMsg = '';
const R = () => ({ ...REG_DEFAUT, ...(data.reglages || {}), ...(regLocal || {}) });
const ghRepo = (() => { const m = location.hostname.match(/^([^.]+)\.github\.io$/); const r = location.pathname.split('/').filter(Boolean)[0]; return m && r ? `${m[1]}/${r}` : null; })();
function appliquerReglages() {
  const r = R();
  for (const l of data.lots) {
    const pct = l.fraisPct ?? r.fraisAcheteurParDefautPourcent;
    l.coutTotal = l.prixProbable ? Math.round(l.prixProbable * (1 + pct / 100) + (+r.fraisFixesParVoiture || 0)) : null;
    l.marge = l.cote && l.coutTotal ? l.cote - l.coutTotal : null;
    l.dansZone = !l.departement || r.departementsRetrait.includes(l.departement);
    l.bonneAffaire = !!(l.marge != null && l.marge >= r.margeMinBonneAffaire && l.prixProbable <= r.prixMaxAchat && !l.risque && l.dansZone);
  }
}
async function api(chemin, opts = {}) {
  const rep = await fetch(`https://api.github.com/repos/${ghRepo}${chemin}`, { ...opts, headers: { Accept: 'application/vnd.github+json', ...(gh.token ? { Authorization: 'Bearer ' + gh.token } : {}), ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (!rep.ok) throw new Error(rep.status === 401 ? 'clé GitHub refusée (expirée ou mal copiée)' : rep.status === 403 || rep.status === 404 ? 'la clé GitHub n\'a pas les bons droits' : 'erreur ' + rep.status);
  return rep.status === 204 ? null : rep.json();
}
async function envoyerReglages() {
  const actuel = await api('/contents/config.json');
  const ancien = JSON.parse(decodeURIComponent(escape(atob(actuel.content.replace(/\n/g, '')))));
  const r = R();
  const cfg = { ...ancien, prixMaxAchat: r.prixMaxAchat, margeMinBonneAffaire: r.margeMinBonneAffaire, fraisFixesParVoiture: r.fraisFixesParVoiture, fraisAcheteurParDefautPourcent: r.fraisAcheteurParDefautPourcent, departementsRetrait: r.departementsRetrait, maxAlertesParPassage: r.maxAlertesParPassage, sources: r.sources };
  const texte = JSON.stringify(cfg, null, 2) + '\n';
  await api('/contents/config.json', { method: 'PUT', body: JSON.stringify({ message: 'Réglages modifiés depuis l\'appli', content: btoa(unescape(encodeURIComponent(texte))), sha: actuel.sha }) });
}
async function dernierPassage() {
  try {
    const d = await api('/actions/workflows/chasse.yml/runs?per_page=1');
    const run = d.workflow_runs?.[0]; const el = $('#passage'); if (!run || !el) return;
    const quandR = new Date(run.created_at).toLocaleString('fr-FR', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

document.addEventListener('submit', async (e) => {

    const r = R();

    regLocal = { prixMaxAchat: n(d.prixMaxAchat, r.prixMaxAchat), margeMinBonneAffaire: n(d.margeMinBonneAffaire, r.margeMinBonneAffaire), fraisFixesParVoiture: n(d.fraisFixesParVoiture, r.fraisFixesParVoiture), fraisAcheteurParDefautPourcent: n(d.fraisAcheteurParDefautPourcent, r.fraisAcheteurParDefautPourcent), departementsRetrait: deps.length ? deps : r.departementsRetrait, maxAlertesParPassage: Math.round(n(d.maxAlertesParPassage, r.maxAlertesParPassage)), sources: { interencheres: !!d.src_interencheres, alcopa: !!d.src_alcopa, domaines: !!d.src_domaines } };
    store.set('reglages', regLocal); f.prixMax = regLocal.prixMaxAchat; store.set('filtres', f); appliquerReglages();
    if (gh.token && ghRepo) { ghMsg = '⏳ Envoi au robot…'; rendre(); try { await envoyerReglages(); ghMsg = '✅ Réglages enregistrés et envoyés au robot.'; } catch (err) { ghMsg = '❌ Enregistré sur le téléphone, mais pas envoyé au robot : ' + err.message; } }
    else ghMsg = '✅ Réglages enregistrés sur le téléphone.';
    rendre(); return;
  }
  if (e.target.id === 'connexion') {
    e.preventDefault();
    const t = String(new FormData(e.target).get('token') || '').trim(); if (!t) return;
    if (!ghRepo) { ghMsg = 'Ouvre l\'appli depuis son adresse github.io pour connecter GitHub.'; rendre(); return; }
    gh = { token: t };
    try { const rr = await api(''); if (!rr.permissions?.push) throw new Error('la clé n\'a pas le droit d\'écrire (Contents : Read and write)'); store.set('gh', gh); ghMsg = '✅ GitHub connecté.'; }
    catch (err) { gh = { token: '' }; ghMsg = '❌ Connexion impossible : ' + err.message; }
    rendre();
  }
});
